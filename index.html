<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d080c">
  <title>狱国争霸</title>
  <!-- 标题用毛笔字体；离线时自动退回系统楷体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
  <style>
    html { height: 100%; box-sizing: border-box; background: #0d080c; overflow: hidden; }
    body { margin: 0; height: 100%; background: #0d080c; overflow: hidden; }
    #stage { width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game" aria-label="狱国争霸游戏画面"></canvas></div>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/mapgen.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/render.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (document.fonts && document.fonts.load) {
      document.fonts.load('48px "Ma Shan Zheng"', '狱国争霸主公忠臣反贼内奸胜利败北你已阵亡开战暂停玩法说明身份无中生有万箭齐发南蛮入侵桃无懈可击').catch(function () {});
    }
    window.game = YG.boot(YG.createBrowserPlatform(document.getElementById('game')));
  </script>
</body>
</html>
